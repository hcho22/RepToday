# Deployed runtime target. Production updates require the dedicated reviewed native held-stage/
# release boundary; this file alone grants no deployment authority. No account IDs or keys.
name = "reptoday-variety-language-proxy"
main = "src/coach-auth-worker.js"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false
logpush = false
send_metrics = false
routes = []

[observability]
enabled = false

[vars]
COACH_AUTH_MODE = "app-attest-storekit-v1"

[alias]
"node-fetch" = "./src/apple-fetch.js"

# The settings tools/coach-runtime-migrate.mjs deploys with: Durable Objects take new code at once,
# and, since this file sits beside package.json, a deploy of it uploads no npm dependency list.
[dependencies_instrumentation]
enabled = false

[durable_objects]
code_update_strategy = { mode = "immediate" }

[[durable_objects.bindings]]
name = "COACH_AUTH_STATE"
class_name = "CoachAuthenticationState"

[[migrations]]
tag = "coach-security-v1"
new_sqlite_classes = ["CoachAuthenticationState"]
