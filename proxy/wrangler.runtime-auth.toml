# Local/reviewable migration target only. Do not deploy until Apple prerequisites, metadata
# authority and the dedicated native provisioning/hold flow are reviewed. No account IDs or keys.
name = "reptoday-variety-language-proxy"
main = "src/coach-auth-worker.js"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false
logpush = false
send_metrics = false
routes = []

[observability]
enabled = false

[vars]
COACH_AUTH_MODE = "app-attest-storekit-v1"

[alias]
"node-fetch" = "./src/apple-fetch.js"

[[durable_objects.bindings]]
name = "COACH_AUTH_STATE"
class_name = "CoachAuthenticationState"

[[migrations]]
tag = "coach-security-v1"
new_sqlite_classes = ["CoachAuthenticationState"]
