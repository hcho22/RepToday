name = "reptoday-variety-language-proxy"
main = "src/worker.js"
# AbortSignal.timeout and modern fetch semantics require a recent compatibility date.
compatibility_date = "2026-01-01"

# Non-secret config. The API key is a secret, set out-of-band (never committed):
#   wrangler secret put ANTHROPIC_API_KEY
#   wrangler secret put OPENAI_API_KEY
[vars]
# The Claude model used only by Variety Language. The Coach has a route-specific, source-pinned
# OpenAI model so changing this variable cannot move the premium Coach.
ANTHROPIC_MODEL = "claude-opus-4-8"
