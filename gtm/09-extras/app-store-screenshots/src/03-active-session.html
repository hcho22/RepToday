<title>Rep Today - App Store screenshot 3 - Active session</title>
<link rel="stylesheet" href="shared.css">
<style>
  .session-meta { text-align: center; margin: 10px 0 0; }
  .move-title { margin: 6px 0 0; font-size: 34px; line-height: 40px; font-weight: 700; text-align: center; color: #1B2228; }
  .move-pillar { margin: 4px 0 0; text-align: center; }
  .ring-wrap { display: flex; justify-content: center; margin-top: 22px; position: relative; }
  .ring-center {
    position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: 240px; height: 240px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .ring-center .clock { font-size: 52px; line-height: 56px; font-weight: 700; color: #1B2228; }
  .ring-center .of { font-size: 14px; line-height: 20px; color: #525E66; margin-top: 2px; }
  .illus { margin-top: 26px; padding: 16px; }
  .next-row {
    margin-top: 16px; padding: 0 16px; height: 62px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .next-row .label { font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: 0.04em; color: #525E66; }
  .next-row .what { font-size: 17px; font-weight: 600; color: #1B2228; }
  .next-row .dur { font-size: 15px; color: #525E66; }
  .btn-pause { position: absolute; left: 20px; right: 20px; bottom: 32px; }
</style>

</div>
