<title>Scene 8 - Close</title>
<style>
  @font-face { font-family: "RT Rounded"; src: url("file:///System/Library/Fonts/SFNSRounded.ttf"); } /* system SF Rounded; needs --allow-file-access-from-files */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body {
    background: #14181C; /* Night */
    color: #F1EEE8;      /* Bone */
    font-family: "RT Rounded", ui-rounded, "SF Pro Rounded", -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  }
  .frame {
    width: 1920px; height: 1080px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 120px 160px;
    position: relative;
  }
  /* Wordmark lockup per guidelines section 3:
     gap = 50% of mark width, name cap height = 2/3 of mark height. */
  .wordmark { display: flex; align-items: center; }
  .wordmark .mark { width: 132px; height: 132px; display: block; }
  .wordmark .name {
    margin-left: 66px;
    font-size: 126px; line-height: 1; font-weight: 700;
    color: #F1EEE8;
  }
  .tagline {
    margin-top: 56px;
    font-size: 44px; line-height: 56px; font-weight: 600;
    color: #F1EEE8;
  }
  .coming {
    margin-top: 24px;
    font-size: 36px; line-height: 48px; font-weight: 400;
    color: #A7B0B8; /* Mist */
  }
  .legal {
    position: absolute;
    bottom: 64px; left: 0; right: 0;
    font-size: 32px; line-height: 42px; font-weight: 400;
    color: #A7B0B8; /* Mist */
    text-align: center;
  }
</style>
<div class="frame">
  <div class="wordmark">
    <svg class="mark" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-label="Rep Today Ready Mark">
      <rect x="10" y="10" width="80" height="80" rx="17.6" fill="none" stroke="#5FA981" stroke-width="5.6"/>
      <circle cx="50" cy="66" r="12" fill="#5FA981"/>
    </svg>
    <span class="name">Rep Today</span>
  </div>
  <div class="tagline">Opens to a ready workout</div>
  <div class="coming">Coming soon to iOS</div>
  <div class="legal">Screen images simulated. App is pre-release.</div>
</div>
