<title>Scene 5 - Three pillars</title>
<style>
  @font-face { font-family: "RT Rounded"; src: url("file:///System/Library/Fonts/SFNSRounded.ttf"); } /* system SF Rounded; needs --allow-file-access-from-files */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body {
    background: #14181C; /* Night */
    color: #F1EEE8;      /* Bone */
    font-family: "RT Rounded", ui-rounded, "SF Pro Rounded", -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  }
  .frame {
    width: 1920px; height: 1080px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 160px; gap: 48px;
  }
  .pillar {
    font-size: 132px; line-height: 144px; font-weight: 700;
    color: #F1EEE8;
    opacity: 0.14; /* dimmed until its moment */
  }
  body.k1 .p1 { opacity: 1; }
  body.k2 .p1, body.k2 .p2 { opacity: 1; }
  body.k3 .p1, body.k3 .p2, body.k3 .p3 { opacity: 1; }
</style>
<div class="frame">
  <div class="pillar p1">Strength.</div>
  <div class="pillar p2">Mobility.</div>
  <div class="pillar p3">Primal.</div>
</div>
<script>
  var k = new URLSearchParams(location.search).get('k');
  document.body.classList.add(k === '1' ? 'k1' : k === '2' ? 'k2' : 'k3');
</script>
