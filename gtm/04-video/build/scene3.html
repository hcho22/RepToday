<title>Scene 3 - The Ready Screen</title>
<style>
  @font-face { font-family: "RT Rounded"; src: url("file:///System/Library/Fonts/SFNSRounded.ttf"); } /* system SF Rounded; needs --allow-file-access-from-files */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body {
    background: #14181C; /* Night */
    color: #F1EEE8;      /* Bone */
    font-family: "RT Rounded", ui-rounded, "SF Pro Rounded", -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  }
  .frame {
    width: 1920px; height: 1080px;
    display: flex; align-items: center; justify-content: center;
    gap: 140px; padding: 0 160px;
  }
  .copy { max-width: 780px; }
  .headline {
    font-size: 92px; line-height: 104px; font-weight: 700;
    color: #F1EEE8;
  }
  .sub {
    margin-top: 40px;
    font-size: 36px; line-height: 56px; font-weight: 400;
    color: #A7B0B8; /* Mist */
    max-width: 20em;
  }

  /* Faithful Ready Screen mock, Night theme, app tokens:
     base-4 spacing, 16px card radius, one dominant Start button. */
  .phone {
    width: 430px; height: 880px; flex: none;
    border-radius: 64px;
    background: #14181C;
    border: 3px solid #2A323A;
    padding: 56px 32px 36px;
    display: flex; flex-direction: column;
  }
  .today-label {
    font-size: 24px; line-height: 32px; font-weight: 500;
    letter-spacing: 0.04em; color: #A7B0B8;
  }
  .today-duration {
    margin-top: 4px;
    font-size: 58px; line-height: 66px; font-weight: 700;
    color: #F1EEE8;
  }
  .blocks { margin-top: 28px; display: flex; flex-direction: column; gap: 16px; }
  .block {
    background: #1E242A; /* Night surface */
    border-radius: 16px; padding: 22px 24px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .block .name  { font-size: 29px; line-height: 36px; font-weight: 600; color: #F1EEE8; }
  .block .pillar { margin-top: 2px; font-size: 21px; line-height: 26px; font-weight: 400; color: #A7B0B8; }
  .block .mins  { font-size: 24px; line-height: 30px; font-weight: 400; color: #A7B0B8; }
  .start {
    margin-top: auto;
    height: 88px; border-radius: 20px;
    background: #5FA981; /* Fern - the one accent, the one dominant action */
    color: #14181C;
    display: flex; align-items: center; justify-content: center;
    font-size: 36px; font-weight: 700;
  }
</style>
<div class="frame">
  <div class="copy">
    <div class="headline">The workout is already there.</div>
    <div class="sub">Built on your phone in under 100 milliseconds. No questions. No account. No internet needed.</div>
  </div>
  <div class="phone">
    <div class="today-label">Today</div>
    <div class="today-duration">12 min</div>
    <div class="blocks">
      <div class="block">
        <div><div class="name">Push-ups</div><div class="pillar">Strength</div></div>
        <div class="mins">3 min</div>
      </div>
      <div class="block">
        <div><div class="name">Hip hinge flow</div><div class="pillar">Mobility</div></div>
        <div class="mins">3 min</div>
      </div>
      <div class="block">
        <div><div class="name">Bear crawl</div><div class="pillar">Primal</div></div>
        <div class="mins">3 min</div>
      </div>
      <div class="block">
        <div><div class="name">Wall sit</div><div class="pillar">Strength</div></div>
        <div class="mins">3 min</div>
      </div>
    </div>
    <div class="start">Start</div>
  </div>
</div>
