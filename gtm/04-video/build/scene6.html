<title>Scene 6 - Forgiveness</title>
<style>
  @font-face { font-family: "RT Rounded"; src: url("file:///System/Library/Fonts/SFNSRounded.ttf"); } /* system SF Rounded; needs --allow-file-access-from-files */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body {
    background: #14181C; /* Night */
    color: #F1EEE8;      /* Bone */
    font-family: "RT Rounded", ui-rounded, "SF Pro Rounded", -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  }
  .frame {
    width: 1920px; height: 1080px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 160px;
  }
  .headline {
    font-size: 96px; line-height: 110px; font-weight: 700;
    color: #F1EEE8; max-width: 14em;
  }
  /* Two weeks of showing up. One missed day. Still whole. */
  .days {
    margin-top: 88px;
    display: flex; gap: 30px; align-items: center;
  }
  .day {
    width: 26px; height: 26px; border-radius: 50%;
    background: #5FA981; /* Fern */
  }
  .day.missed {
    background: none;
    border: 3px solid #A7B0B8; /* Mist ring - dented, not erased */
  }
  .caption {
    margin-top: 36px;
    font-size: 30px; line-height: 42px; font-weight: 400;
    color: #A7B0B8;
  }
</style>
<div class="frame">
  <div class="headline">Missing a day never zeroes you out.</div>
  <div class="days">
    <div class="day"></div><div class="day"></div><div class="day"></div>
    <div class="day"></div><div class="day"></div><div class="day"></div>
    <div class="day"></div><div class="day"></div><div class="day"></div>
    <div class="day missed"></div>
    <div class="day"></div><div class="day"></div><div class="day"></div>
    <div class="day"></div>
  </div>
  <div class="caption">Your score dips. It never resets.</div>
</div>
