<title>Scene 2 - The Ready Mark draws in</title>
<style>
  @font-face { font-family: "RT Rounded"; src: url("file:///System/Library/Fonts/SFNSRounded.ttf"); } /* system SF Rounded; needs --allow-file-access-from-files */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body {
    background: #14181C; /* Night */
    font-family: "RT Rounded", ui-rounded, "SF Pro Rounded", -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  }
  .frame {
    width: 1920px; height: 1080px;
    display: flex; align-items: center; justify-content: center;
  }
  .mark { width: 380px; height: 380px; display: block; }
  /* Keyframe 1: the rounded square is partially drawn, no circle yet. */
  body.k1 #ready-rect { stroke-dasharray: 46 54; }
  body.k1 #ready-circle { opacity: 0; }
  /* Keyframe 2: square complete, circle not yet there. */
  body.k2 #ready-circle { opacity: 0; }
  /* Keyframe 3 (default): the full Ready Mark - the Start circle is already there. */
</style>
<div class="frame">
  <!-- Ready Mark, Fern on Night, construction per brand guidelines section 3 -->
  <svg class="mark" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-label="Rep Today Ready Mark">
    <rect id="ready-rect" x="10" y="10" width="80" height="80" rx="17.6" pathLength="100"
          fill="none" stroke="#5FA981" stroke-width="5.6" stroke-linecap="round"/>
    <circle id="ready-circle" cx="50" cy="66" r="12" fill="#5FA981"/>
  </svg>
</div>
<script>
  var k = new URLSearchParams(location.search).get('k');
  if (k === '1' || k === '2') document.body.classList.add('k' + k);
</script>
