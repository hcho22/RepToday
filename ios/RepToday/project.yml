name: RepToday
options:
  bundleIdPrefix: com.reptoday
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.3"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "QH9S83CX4Y"

# Lottie powers the exercise demo animations (US-O01). The app ships on SF-Symbol demos and each
# exercise lights up as its bundled animation file is added; no animation files ship yet, so the
# dependency is the seam + graceful fallback only.
packages:
  Lottie:
    url: https://github.com/airbnb/lottie-ios
    from: "4.5.0"

targets:
  RepToday:
    type: application
    platform: iOS
    sources:
      - path: RepToday
        # The StoreKit config is attached to the scheme (below), not shipped in the app bundle:
        # exclude it from the target's sources so xcodegen never adds the placeholder prices/ids
        # to Copy Bundle Resources, then re-add it in no build phase so it stays visible/referenced.
        excludes:
          - Resources/RepToday.storekit
      - path: RepToday/Resources/RepToday.storekit
        buildPhase: none
    dependencies:
      - package: Lottie
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reptoday.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Rep Today"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # A partial Info.plist merged with the keys Xcode generates. It carries the CloudKit
        # remote-notification background mode (US-N02) and the HealthKit write usage description
        # (US-N03, NSHealthUpdateUsageDescription) - the privacy string shown when Rep Today first
        # asks to write sessions to Health.
        INFOPLIST_FILE: RepToday/Info.plist
        # CloudKit sync (US-N02), Sign in with Apple (US-N01), and HealthKit (US-N03) are all
        # additive: the store degrades to local-only, the sign-in falls back gracefully, and the
        # Health write is best-effort/skipped when unavailable (e.g. an unsigned Simulator build
        # with no provisioning), so the core loop is never gated.
        CODE_SIGN_ENTITLEMENTS: RepToday/RepToday.entitlements
      # The anonymous-telemetry deployment origin (US-T04), split per configuration and expanded
      # into `Info.plist`'s `RepTodayAnalyticsEndpoint` key. Debug points at the *development*
      # deployment; Release carries nothing, because no production deployment has been chosen -
      # that is an open question in `.claude/agent/tasks/prd-funnel-instrumentation_260803.md` and
      # it stays open here rather than being guessed at. An empty value takes the existing inert
      # path: `LiveAnalyticsService.configured(...)` returns nil and the container falls back to
      # `NoOpAnalyticsService`, so an unconfigured Release build emits nothing and fails nothing.
      # The worst case is therefore silently no data rather than silently the wrong destination.
      # Choosing and setting the production origin here is a precondition for shipping any build
      # that emits (US-T07 onward).
      # The US-T14 shared secret, split the same way and for the same reasons: Debug carries the
      # *development* deployment's secret and Release carries nothing (no production deployment
      # chosen). It is sent on every `POST /logEvent` so a stranger who discovers the endpoint URL
      # cannot flood the `events` table. It is a *cost-raiser, not a guarantee* - committed here and
      # shipped in the binary, so it is extractable by anyone who unpacks the app; it stops
      # opportunistic flooding, not a determined attacker (see `convex/README.md`). The Debug value
      # must match the deployment's `ANALYTICS_SHARED_SECRET` env var (`npx convex env set`). An empty
      # value is inert exactly like an empty endpoint: `LiveAnalyticsService.configured(...)` returns
      # nil and the container falls back to `NoOpAnalyticsService`.
      # The premium coach proxy's `POST /coach` origin (US-AC02), split per configuration and expanded
      # into `Info.plist`'s `RepTodayCoachEndpoint` key exactly like the telemetry endpoint above. The
      # `proxy/` Cloudflare Worker is deploy-ready but not yet deployed, so BOTH configurations carry
      # nothing today: an empty value is inert (`CoachProxyClient.configured(...)` returns nil and the
      # container leaves `coachClient` nil), so the chat surface shows a clear "coach unavailable" state
      # and never points at a wrong destination. Setting this to the deployed `https://<worker>/coach`
      # origin is a one-line change once the proxy ships (US-AC03 gates the entry point behind premium).
      # The coach shared secret is split the same way and is *optional* - an open dev Worker with no
      # secret set matches an empty value here (no `Authorization` header), unlike the telemetry secret
      # which is required. When the proxy sets `CLIENT_SHARED_SECRET`, put the matching value here.
      configs:
        Debug:
          REPTODAY_ANALYTICS_ENDPOINT: https://courteous-dogfish-560.convex.site
          REPTODAY_ANALYTICS_SECRET: d8f3a1c07b9e4256a1c3e5f7091b2d4e
          REPTODAY_COACH_ENDPOINT: ""
          REPTODAY_COACH_SECRET: ""
        Release:
          REPTODAY_ANALYTICS_ENDPOINT: ""
          REPTODAY_ANALYTICS_SECRET: ""
          REPTODAY_COACH_ENDPOINT: ""
          REPTODAY_COACH_SECRET: ""
    # The generated RepToday scheme runs the tests and attaches the local StoreKit configuration
    # (US-N04), so premium purchases/restores can be exercised in the Simulator without App Store
    # Connect. The paywall never gates the core loop; the free tier is unlimited forever.
    scheme:
      testTargets:
        - RepTodayTests
      storeKitConfiguration: RepToday/Resources/RepToday.storekit
      # The test bundle runs inside the Simulator and so does not inherit the invoking shell's
      # environment. These carry opt-in flags in through a build setting, which xcodebuild does accept
      # on the command line. The two evidence flags redirect the evidence suites
      # (`PerSideSwapEvidenceTests`, `OnboardingBasicsEvidenceTests`, `ProgressTabSnapshotTests`), read
      # through the one `EvidenceOutput` resolver rather than each rolling its own; `RUN_SESSION_BENCHMARK`
      # opts the otherwise-skipped `SessionGenerationBenchmarkTests` latency harness into running.
      # Undefined they expand to nothing, so a plain test run renders to a temporary directory and skips
      # the benchmark, leaving the repo untouched; passing `REPTODAY_WRITE_EVIDENCE=1` (or
      # `REPTODAY_EVIDENCE_DIR=<root>`, which names a *root* with the story folder appended, never the
      # final directory) redirects the renders, and passing `RUN_SESSION_BENCHMARK=1` runs the benchmark,
      # deliberately.
      environmentVariables:
        REPTODAY_WRITE_EVIDENCE: "$(REPTODAY_WRITE_EVIDENCE)"
        REPTODAY_EVIDENCE_DIR: "$(REPTODAY_EVIDENCE_DIR)"
        RUN_SESSION_BENCHMARK: "$(RUN_SESSION_BENCHMARK)"

  RepTodayTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RepTodayTests
    dependencies:
      - target: RepToday
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reptoday.app.tests
        GENERATE_INFOPLIST_FILE: YES

  # The unit bundle hosts production views in a window, which is enough to read what is drawn and
  # what VoiceOver speaks - but not to press anything: a `Button`'s press state is decided by the
  # touch delivery the app process only gets from a real finger. The onboarding step buttons are
  # hand-drawn and repeat while held, so a tap landing, sliding, or lifting is exactly where they
  # break; this target exists so those are pressed rather than argued about.
  RepTodayUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: RepTodayUITests
    dependencies:
      - target: RepToday
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reptoday.app.uitests
        GENERATE_INFOPLIST_FILE: YES

# The UI suite gets its own scheme rather than joining `RepToday`'s. It installs and launches the app
# in a booted Simulator and drives it out of process, which is a slower and more fragile thing to
# stand on than the unit bundle's hosted windows; folding it into the scheme everything else runs
# through would make every unit run wait on an app launch and inherit its failure modes. Keeping it
# separate leaves `-scheme RepToday test` exactly the run it has always been, and the touch path is
# asked for by name - `-scheme RepTodayUITests test` - when that is what is in question.
schemes:
  RepTodayUITests:
    build:
      targets:
        RepTodayUITests: [test]
    test:
      targets:
        - RepTodayUITests
      # The same evidence opt-in the generated `RepToday` scheme carries, for the same reason: the
      # XCUITest runner is a Simulator process and inherits nothing from the invoking shell, so the
      # two variables are expanded from build settings, which xcodebuild does accept on the command
      # line. Undefined they expand to nothing and `OnboardingImperialUITests` writes its screenshots
      # to a per-run temporary directory, leaving the repo untouched; `REPTODAY_WRITE_EVIDENCE=1`
      # points them at `artifacts/reports/us-o04/` and `REPTODAY_EVIDENCE_DIR=<path>` overrides the
      # destination outright - identical to `PerSideSwapEvidenceTests` and
      # `OnboardingBasicsEvidenceTests` in the unit bundle.
      environmentVariables:
        REPTODAY_WRITE_EVIDENCE: "$(REPTODAY_WRITE_EVIDENCE)"
        REPTODAY_EVIDENCE_DIR: "$(REPTODAY_EVIDENCE_DIR)"
