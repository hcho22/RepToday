name: RepToday
options:
  bundleIdPrefix: com.reptoday
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.3"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  defaultConfig: Debug

# Clerk's official iOS SDK (M3, ADR-0016). Only its `ClerkKit` core target is linked - the sign-in
# screen is the app's own - and ClerkKit itself depends on no other package. Pinned to one exact
# version so every build compiles the same SDK. It requires Swift tools 6.2 (Xcode 26 or later).
packages:
  Clerk:
    url: https://github.com/clerk/clerk-ios
    exactVersion: 1.7.1

configs:
  Debug: debug
  Release: release
  CoachDeviceQA: release
  CoachStaging: release

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "QH9S83CX4Y"
  configs:
    CoachDeviceQA:
      # Keep optimized release behavior while allowing this dedicated lane's @testable XCTest bundle.
      ENABLE_TESTABILITY: YES
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) COACH_IPHONE_QA"
    # Release-optimized Coach staging lane; its client code exists only under COACH_STAGING.
    CoachStaging:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) COACH_STAGING"

targets:
  RepToday:
    type: application
    platform: iOS
    sources:
      - path: RepToday
        # The StoreKit config is attached to the scheme (below), not shipped in the app bundle:
        # exclude it from the target's sources so xcodegen never adds the placeholder prices/ids
        # to Copy Bundle Resources, then re-add it in no build phase so it stays visible/referenced.
        excludes:
          - Resources/RepToday.storekit
      - path: RepToday/Resources/RepToday.storekit
        buildPhase: none
    # US-TP05: every build lists each served movement lacking a full Trainer start/end pose pair (and
    # any Trainer image set whose name maps to nothing) as Xcode warnings. Gaps never fail the build -
    # the player degrades per movement on its own - but an unreadable input does, so a broken check
    # cannot pass silently. It always runs (no outputs to compare against), so the warnings show on
    # every build, CI's `ios` job included; the inputs are declared so it runs under script sandboxing.
    preBuildScripts:
      - name: Report Trainer art gaps
        script: |
          /usr/bin/python3 "${SRCROOT}/../../tools/check-trainer-art.py" "${SRCROOT}/RepToday/Resources/Exercises.json" "${SRCROOT}/RepToday/Resources/Assets.xcassets"
        inputFiles:
          - $(SRCROOT)/../../tools/check-trainer-art.py
          - $(SRCROOT)/RepToday/Resources/Exercises.json
          - $(SRCROOT)/RepToday/Resources/Assets.xcassets
        basedOnDependencyAnalysis: false
        showEnvVars: false
    dependencies:
      - package: Clerk
        product: ClerkKit
    # Each supplies one value from an untracked local file that no other configuration reads:
    # CoachStaging its REPTODAY_COACH_STAGING_SUBDOMAIN, Debug the dev REPTODAY_ANALYTICS_SECRET.
    configFiles:
      Debug: Config/DebugTelemetry.xcconfig
      CoachStaging: Config/CoachStaging.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reptoday.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "5"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Rep Today"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # A partial Info.plist merged with the keys Xcode generates. It carries the CloudKit
        # remote-notification background mode (US-N02, kept only for a pre-account user's one-time
        # iCloud import, M3) and the HealthKit write and bounded-read usage descriptions (US-N03). Rep Today requests no general Health read authorization, but its
        # metadata-filtered duplicate check still requires NSHealthShareUsageDescription.
        INFOPLIST_FILE: RepToday/Info.plist
        # The iCloud container (read only by a pre-account user's one-time import, M3), Sign in with
        # Apple (through Clerk since M3), and HealthKit (US-N03). The iCloud mirror degrades to
        # local-only and the Health integration is best-effort/skipped when unavailable (e.g. an
        # unsigned Simulator build with no provisioning), so the core loop is never gated.
        CODE_SIGN_ENTITLEMENTS: RepToday/RepToday.entitlements
      # The anonymous-telemetry deployment origin (US-T04), split per configuration and expanded
      # into `Info.plist`'s `RepTodayAnalyticsEndpoint` key. Debug points at the *development*
      # deployment; Release points at the production deployment `sensible-spider-810`. An empty
      # override still takes the existing inert path: `LiveAnalyticsService.configured(...)` returns
      # nil and the container falls back to
      # `NoOpAnalyticsService`, so an unconfigured Release build emits nothing and fails nothing.
      # The worst case is therefore silently no data rather than silently the wrong destination,
      # which is also the documented emergency disable/rollback posture.
      # The US-T14 shared secret is sent on every `POST /logEvent` so a stranger who discovers the
      # endpoint URL cannot flood the `events` table. No configuration commits a value for it: this
      # repository is treated as public (its visibility has changed before), so the literal must
      # never enter this file, a tracked xcconfig or the generated project
      # (`tools/check-no-committed-telemetry-secret.py` fails CI if one does).
      # Both values come from the macOS login Keychain by the same route, a private xcconfig:
      # Release receives the production value at archive time (`tools/archive-release.sh`), and
      # Debug reads the dev value from the untracked file `Config/DebugTelemetry.xcconfig`
      # optionally includes (`tools/dev-telemetry-secret.sh install`).
      # Debug therefore sets no `REPTODAY_ANALYTICS_SECRET` below - a target-level value would
      # override that file. It is a *cost-raiser, not a guarantee* - shipped in the binary, so it is
      # extractable by anyone who unpacks the app; it stops opportunistic flooding, not a determined
      # attacker (see `convex/README.md`). An empty value is inert exactly like an empty endpoint:
      # `LiveAnalyticsService.configured(...)` returns nil and the container falls back to
      # `NoOpAnalyticsService`, which is what a Debug build made without the Keychain item does.
      # Release enables the approved public Coach origin with App Attest/StoreKit and no binary
      # secret. Debug stays inert; CoachDeviceQA retains its separate synthetic preparation lane.
      # Deployment confirmation is separate from genuine-device/model QA; see
      # docs/coach-runtime-authentication.md.
      # The account backend (M3, ADR-0016): the Clerk publishable key and the Convex deployment the
      # app syncs to, expanded into `Info.plist`'s `RepTodayClerkPublishableKey` and
      # `RepTodayConvexURL`. A publishable key is a public identifier, safe in a public repository; the
      # Clerk secret key lives only on the Convex deployment (`npx convex env set`). Debug and the two
      # Coach QA lanes use the Clerk development instance and the dev deployment. Release stays empty
      # until the production Clerk instance and backend are released, and `tools/archive-release.sh`
      # refuses to archive without both, because a Release build that cannot sign in cannot be used.
      configs:
        Debug:
          REPTODAY_CLERK_PUBLISHABLE_KEY: pk_test_ZGVhci1mbG91bmRlci03NzM1LmNsZXJrLmFjY291bnRzLmRldiQ
          REPTODAY_CONVEX_URL: https://courteous-dogfish-560.convex.cloud
          REPTODAY_ANALYTICS_ENDPOINT: https://courteous-dogfish-560.convex.site
          # The secret key is absent here on purpose, not forgotten: see the comment above.
          REPTODAY_COACH_SYNTHETIC_QA: "0"
          REPTODAY_COACH_ENDPOINT: ""
          REPTODAY_COACH_SECRET: ""
          REPTODAY_COACH_AUTH_MODE: "app-attest-storekit-v1"
        Release:
          REPTODAY_CLERK_PUBLISHABLE_KEY: ""
          REPTODAY_CONVEX_URL: ""
          REPTODAY_ANALYTICS_ENDPOINT: https://sensible-spider-810.convex.site
          REPTODAY_ANALYTICS_SECRET: ""
          REPTODAY_COACH_SYNTHETIC_QA: "0"
          REPTODAY_COACH_ENDPOINT: https://coach.reptoday.app/coach
          REPTODAY_COACH_SECRET: ""
          REPTODAY_COACH_AUTH_MODE: "app-attest-storekit-v1"
        CoachDeviceQA:
          INFOPLIST_KEY_CFBundleDisplayName: "Rep Today Coach QA"
          REPTODAY_CLERK_PUBLISHABLE_KEY: pk_test_ZGVhci1mbG91bmRlci03NzM1LmNsZXJrLmFjY291bnRzLmRldiQ
          REPTODAY_CONVEX_URL: https://courteous-dogfish-560.convex.cloud
          REPTODAY_ANALYTICS_ENDPOINT: ""
          REPTODAY_ANALYTICS_SECRET: ""
          REPTODAY_COACH_ENDPOINT: https://coach.reptoday.app/coach
          REPTODAY_COACH_SECRET: ""
          REPTODAY_COACH_AUTH_MODE: "app-attest-storekit-v1"
          REPTODAY_COACH_SYNTHETIC_QA: "1"
        # The separate staging Worker (tools/coach-staging.sh). Same App Attest mode and no secret; the
        # client accepts only this exact workers.dev URL and only when compiled with COACH_STAGING.
        CoachStaging:
          INFOPLIST_KEY_CFBundleDisplayName: "Rep Today Coach Staging"
          REPTODAY_CLERK_PUBLISHABLE_KEY: pk_test_ZGVhci1mbG91bmRlci03NzM1LmNsZXJrLmFjY291bnRzLmRldiQ
          REPTODAY_CONVEX_URL: https://courteous-dogfish-560.convex.cloud
          REPTODAY_ANALYTICS_ENDPOINT: ""
          REPTODAY_ANALYTICS_SECRET: ""
          REPTODAY_COACH_ENDPOINT: "https://reptoday-coach-staging.$(REPTODAY_COACH_STAGING_SUBDOMAIN).workers.dev/coach"
          REPTODAY_COACH_SECRET: ""
          REPTODAY_COACH_AUTH_MODE: "app-attest-storekit-v1"
          REPTODAY_COACH_SYNTHETIC_QA: "0"
    # The generated RepToday scheme runs the tests and attaches the local StoreKit configuration
    # (US-N04), so premium purchases/restores can be exercised in the Simulator without App Store
    # Connect. The paywall never gates the core loop; the free tier is unlimited forever.
    scheme:
      testTargets:
        - RepTodayTests
      storeKitConfiguration: RepToday/Resources/RepToday.storekit
      # The test bundle runs inside the Simulator and so does not inherit the invoking shell's
      # environment. These carry opt-in flags in through a build setting, which xcodebuild does accept
      # on the command line. The two evidence flags redirect the evidence suites
      # (`PerSideSwapEvidenceTests`, `OnboardingBasicsEvidenceTests`, `ProgressTabSnapshotTests`), read
      # through the one `EvidenceOutput` resolver rather than each rolling its own; `RUN_SESSION_BENCHMARK`
      # opts the otherwise-skipped `SessionGenerationBenchmarkTests` latency harness into running.
      # Undefined they expand to nothing, so a plain test run writes evidence to a temporary directory
      # and skips the benchmark, leaving the repo untouched; passing `REPTODAY_WRITE_EVIDENCE=1` (or
      # `REPTODAY_EVIDENCE_DIR=<root>`, which names a *root* with the story folder appended, never the
      # final directory) redirects the evidence, and passing `RUN_SESSION_BENCHMARK=1` runs the benchmark,
      # deliberately.
      environmentVariables:
        REPTODAY_WRITE_EVIDENCE: "$(REPTODAY_WRITE_EVIDENCE)"
        REPTODAY_EVIDENCE_DIR: "$(REPTODAY_EVIDENCE_DIR)"
        RUN_SESSION_BENCHMARK: "$(RUN_SESSION_BENCHMARK)"

  RepTodayTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RepTodayTests
    dependencies:
      - target: RepToday
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reptoday.app.tests
        GENERATE_INFOPLIST_FILE: YES

  # The unit bundle hosts production views in a window, which is enough to read what is drawn and
  # what VoiceOver speaks - but not to press anything: a `Button`'s press state is decided by the
  # touch delivery the app process only gets from a real finger. The onboarding step buttons are
  # hand-drawn and repeat while held, so a tap landing, sliding, or lifting is exactly where they
  # break; this target exists so those are pressed rather than argued about.
  RepTodayUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: RepTodayUITests
    dependencies:
      - target: RepToday
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reptoday.app.uitests
        GENERATE_INFOPLIST_FILE: YES

# The UI suite gets its own scheme rather than joining `RepToday`'s. It installs and launches the app
# in a booted Simulator and drives it out of process, which is a slower and more fragile thing to
# stand on than the unit bundle's hosted windows; folding it into the scheme everything else runs
# through would make every unit run wait on an app launch and inherit its failure modes. Keeping it
# separate leaves `-scheme RepToday test` exactly the run it has always been, and the touch path is
# asked for by name - `-scheme RepTodayUITests test` - when that is what is in question.
schemes:
  # No local StoreKit configuration and no launch-time send. Build this scheme for the iPhone
  # preparation lane; ordinary RepToday keeps Debug/Release and its existing local test setup.
  RepTodayCoachDeviceQA:
    build:
      targets:
        RepToday: all
    run:
      config: CoachDeviceQA
    test:
      config: CoachDeviceQA
      targets:
        - RepTodayTests
    profile:
      config: CoachDeviceQA
    analyze:
      config: CoachDeviceQA
    archive:
      config: CoachDeviceQA
  # Coach staging lane: release-optimized CoachStaging build with no local StoreKit file, so a real
  # Sandbox purchase and App Attest reach the separate staging Worker. Archiving always produces
  # Release, so a staging build can never be archived for distribution.
  RepTodayCoachStaging:
    build:
      targets:
        RepToday: all
    run:
      config: CoachStaging
    profile:
      config: CoachStaging
    analyze:
      config: CoachStaging
    archive:
      config: Release
  RepTodayUITests:
    build:
      targets:
        RepTodayUITests: [test]
    test:
      targets:
        - RepTodayUITests
      # The same evidence opt-in the generated `RepToday` scheme carries, for the same reason: the
      # XCUITest runner is a Simulator process and inherits nothing from the invoking shell, so the
      # two variables are expanded from build settings, which xcodebuild does accept on the command
      # line. Undefined they expand to nothing and `OnboardingImperialUITests` writes its screenshots
      # to a per-run temporary directory, leaving the repo untouched; `REPTODAY_WRITE_EVIDENCE=1`
      # points them at `artifacts/reports/us-o04/` and `REPTODAY_EVIDENCE_DIR=<path>` overrides the
      # destination outright - identical to `PerSideSwapEvidenceTests` and
      # `OnboardingBasicsEvidenceTests` in the unit bundle.
      environmentVariables:
        REPTODAY_WRITE_EVIDENCE: "$(REPTODAY_WRITE_EVIDENCE)"
        REPTODAY_EVIDENCE_DIR: "$(REPTODAY_EVIDENCE_DIR)"
        # Opt-in M3 walks against the development Clerk instance and backend (`AccountEndToEndUITests`).
        REPTODAY_E2E_ACCOUNTS: "$(REPTODAY_E2E_ACCOUNTS)"
        REPTODAY_E2E_EXISTING_USER: "$(REPTODAY_E2E_EXISTING_USER)"
