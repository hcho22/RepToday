name: FitSnack
options:
  bundleIdPrefix: com.fitsnack
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.3"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""

targets:
  FitSnack:
    type: application
    platform: iOS
    sources:
      - path: FitSnack
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fitsnack.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # CloudKit sync (US-N02) delivers changes from other devices via silent push, which
        # requires the remote-notification background mode. Xcode merges this partial Info.plist
        # (the one key that has no INFOPLIST_KEY_ build-setting form) with the keys it generates.
        INFOPLIST_FILE: FitSnack/Info.plist
        # CloudKit sync (US-N02) and Sign in with Apple (US-N01) are additive: the store degrades
        # to local-only and the sign-in falls back gracefully when they are unavailable (e.g. an
        # unsigned Simulator build with no provisioning), so the core loop is never gated.
        CODE_SIGN_ENTITLEMENTS: FitSnack/FitSnack.entitlements

  FitSnackTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FitSnackTests
    dependencies:
      - target: FitSnack
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fitsnack.app.tests
        GENERATE_INFOPLIST_FILE: YES
