name: FitSnack
options:
  bundleIdPrefix: com.fitsnack
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.3"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""

targets:
  FitSnack:
    type: application
    platform: iOS
    sources:
      - path: FitSnack
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fitsnack.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # A partial Info.plist merged with the keys Xcode generates. It carries the CloudKit
        # remote-notification background mode (US-N02) and the HealthKit write usage description
        # (US-N03, NSHealthUpdateUsageDescription) - the privacy string shown when FitSnack first
        # asks to write sessions to Health.
        INFOPLIST_FILE: FitSnack/Info.plist
        # CloudKit sync (US-N02), Sign in with Apple (US-N01), and HealthKit (US-N03) are all
        # additive: the store degrades to local-only, the sign-in falls back gracefully, and the
        # Health write is best-effort/skipped when unavailable (e.g. an unsigned Simulator build
        # with no provisioning), so the core loop is never gated.
        CODE_SIGN_ENTITLEMENTS: FitSnack/FitSnack.entitlements
    # The generated FitSnack scheme runs the tests and attaches the local StoreKit configuration
    # (US-N04), so premium purchases/restores can be exercised in the Simulator without App Store
    # Connect. The paywall never gates the core loop; the free tier is unlimited forever.
    scheme:
      testTargets:
        - FitSnackTests
      storeKitConfiguration: FitSnack/Resources/FitSnack.storekit

  FitSnackTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FitSnackTests
    dependencies:
      - target: FitSnack
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fitsnack.app.tests
        GENERATE_INFOPLIST_FILE: YES
