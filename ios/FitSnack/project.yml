name: FitSnack
options:
  bundleIdPrefix: com.fitsnack
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "16.3"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""

targets:
  FitSnack:
    type: application
    platform: iOS
    sources:
      - path: FitSnack
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fitsnack.app
        INFOPLIST_GENERATION_MODE: GeneratedByXcode
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_NSHealthShareUsageDescription: "FitSnack reads your health data to personalize workouts and track calories."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "FitSnack saves your completed workouts to Apple Health."
    entitlements:
      path: FitSnack/FitSnack.entitlements

  FitSnackTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FitSnackTests
    dependencies:
      - target: FitSnack
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fitsnack.app.tests
        GENERATE_INFOPLIST_FILE: YES
